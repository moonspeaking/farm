<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ферма Айрис</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="theme-color" content="#10140c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ферма Айрис" />
    <style>
      html, body { margin: 0; height: 100%; background: #10140c; overflow: hidden; touch-action: none; }
      #game { position: fixed; inset: 0; }
      #loading { position: fixed; inset: 0; background: #000; z-index: 10; }
      #rotate { position: fixed; left: 0; right: 0; top: 0; z-index: 20; display: none; padding: 10px 44px 10px 14px; background: rgba(20, 40, 12, 0.92); color: #e8f0c8; font: 14px/1.3 system-ui, sans-serif; }
      #install { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 30; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: flex-end; width: min(92vw, 460px); box-sizing: border-box; padding: 12px 14px; border-radius: 10px; background: rgba(20, 40, 12, 0.95); border: 1px solid #8fb24a; color: #e8f0c8; font: 14px/1.35 system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5); }
      #install span { flex: 1 1 100%; }
      #install button { font: inherit; font-weight: 600; padding: 7px 14px; border: 0; border-radius: 6px; background: #8fb24a; color: #14280c; cursor: pointer; }
      #install button.secondary { background: transparent; color: #e8f0c8; border: 1px solid #8fb24a; font-weight: 400; }
      #update { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 31; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: flex-end; width: min(92vw, 460px); box-sizing: border-box; padding: 12px 14px; border-radius: 10px; background: rgba(20, 40, 12, 0.95); border: 1px solid #8fb24a; color: #e8f0c8; font: 14px/1.35 system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5); }
      #update span { flex: 1 1 100%; }
      #update button { font: inherit; font-weight: 600; padding: 7px 14px; border: 0; border-radius: 6px; background: #8fb24a; color: #14280c; cursor: pointer; }
      #update button.secondary { background: transparent; color: #e8f0c8; border: 1px solid #8fb24a; font-weight: 400; }
      #fshint { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 20; display: none; padding: 8px 40px 8px 14px; border-radius: 8px; background: rgba(20, 40, 12, 0.88); color: #e8f0c8; font: 14px/1.3 system-ui, sans-serif; white-space: nowrap; }
      #fshint kbd { display: inline-block; padding: 1px 7px; border: 1px solid #8fb24a; border-radius: 4px; background: rgba(143, 178, 74, 0.2); font: inherit; font-weight: 700; }
      #fshint b { position: absolute; right: 12px; top: 5px; font-size: 20px; cursor: pointer; }
      #rotate b { position: absolute; right: 12px; top: 6px; font-size: 22px; cursor: pointer; }
      #loadcv { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="loading"><canvas id="loadcv"></canvas></div>
    <script>
      // Экран загрузки оригинала (BugsLoadingScreen, exe 0x472f80 / 0x472da0): ромашка в (356; 200) зацветает по показанному
      // проценту; вредитель стоит в x = (1 − процент) · 800 и ползёт справа налево, надпись приклеена справа к нему
      (function () {
        var cv = document.getElementById("loadcv");
        var ctx = cv.getContext("2d");
        var W = 800, H = 600, POS_Y = 300; // loading pos_y из properties_ru.xml
        var BUGS = { snail: 1, kloun: 0.5, pchela: 1, etti: 1, krab: 0.5, spirit: 1, helper: 1, gusenica: 0.5, bug: 0.6 }; // время круга анимации, с
        var names = Object.keys(BUGS);
        var bugName = names[Math.floor(Math.random() * names.length)];
        var flower = new Image();
        flower.src = "img/load_progress.webp";
        var bug = new Image();
        bug.src = "img/bug_" + bugName + "_move_right.webp";
        // target — реальная доля загрузки; shown догоняет её. В оригинале не быстрее dt / 5 (20 % в секунду, экран минимум 5 с) —
        // здесь мягче: скорость пропорциональна отставанию (×2 в секунду), но не больше 0,5 и не меньше 0,12 в секунду —
        // вредитель плавно тормозит к цели, при мгновенной загрузке экран держится ≈2,7 с. fade — появление экрана за 0,2 с
        var target = 0, shown = 0, fade = 0, finished = false, alive = true, t0 = performance.now(), last = t0;
        var el = document.getElementById("loading");
        function resize() {
          var d = window.devicePixelRatio || 1;
          cv.width = innerWidth * d;
          cv.height = innerHeight * d;
        }
        resize();
        addEventListener("resize", resize);
        function frame(now) {
          if (!alive) return;
          var dt = Math.min((now - last) / 1000, 0.1);
          last = now;
          if (shown < target) shown = Math.min(target, shown + dt * Math.max(0.12, Math.min(0.5, (target - shown) * 2)));
          fade = Math.min(1, fade + dt * 5);
          // экран закрывается, когда загрузка закончена и показано больше 99,99 %
          if (finished && shown > 0.9999) {
            alive = false;
            el.style.display = "none";
            return;
          }
          var k = Math.min(cv.width / W, cv.height / H);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.setTransform(k, 0, 0, k, (cv.width - W * k) / 2, (cv.height - H * k) / 2);
          ctx.globalAlpha = fade;
          var t = (now - t0) / 1000;
          // порядок оригинала: вредитель, ромашка, надпись
          var bw = 0, bh = 0, bx = Math.floor((1 - shown) * W + 0.5);
          if (bug.complete && bug.naturalWidth) {
            bw = bug.naturalWidth;
            bh = Math.floor(bug.naturalHeight / 11);
            var bi = Math.floor((t / BUGS[bugName]) * 11) % 11;
            // ползёт влево, а в оригинале взята анимация move/right и вредитель пятится — отражаем её, как левые направления на ферме
            ctx.save();
            ctx.translate(bx + bw, POS_Y - Math.floor(bh / 2));
            ctx.scale(-1, 1);
            ctx.drawImage(bug, 0, bi * bh, bw, bh, 0, 0, bw, bh);
            ctx.restore();
          }
          if (flower.complete && flower.naturalWidth) {
            var fh = Math.floor(flower.naturalHeight / 12);
            var idx = Math.min(11, Math.floor(shown * 12 + 0.001));
            // в skin_ru.xml (356; 200), но тогда низ ромашки (с ореолом y + 85) задевает вредителя, проходящего под ней:
            // самый высокий (etti) достаёт до y = 257. Подняли на 32 px, чтобы ни один вредитель её не касался
            ctx.drawImage(flower, 0, idx * fh, flower.naturalWidth, fh, 356, 168, flower.naturalWidth, fh);
          }
          ctx.fillStyle = "#fff";
          ctx.font = "bold 24px Verdana, system-ui, sans-serif";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "#000";
          ctx.shadowBlur = 4;
          // надпись — сразу за вредителем, по центру его высоты
          ctx.fillText("Идет загрузка... (" + Math.round(shown * 100) + "%)", bx + bw, POS_Y - Math.floor(bh / 2) + bh / 2);
          ctx.shadowBlur = 0;
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        window.__loader = {
          /** Показывает экран снова (загрузка следующей локации): прогресс с нуля. */
          show: function () {
            target = 0;
            shown = 0;
            fade = 0;
            finished = false;
            t0 = last = performance.now();
            el.style.display = "block";
            resize();
            if (!alive) {
              alive = true;
              requestAnimationFrame(frame);
            }
          },
          /** Доля загрузки 0…1. */
          set: function (p) { target = Math.max(target, Math.min(1, p)); },
          /** Загрузка закончена: экран прячется, когда показанный процент дойдёт до 100. */
          done: function () {
            target = 1;
            finished = true;
          },
          fail: function (text) {
            alive = false;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, cv.width, cv.height);
            ctx.fillStyle = "#e8f0c8";
            ctx.font = "18px system-ui, sans-serif";
            ctx.fillText(text, 20, 40);
          },
        };
      })();
    </script>
    <div id="game"></div>
    <div id="fshint">Нажмите <kbd>F</kbd>, чтобы играть во весь экран<b id="fshint-close">×</b></div>
    <div id="rotate">Поверните телефон горизонтально: игра станет крупнее и читабельнее.<b id="rotate-close">×</b></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
